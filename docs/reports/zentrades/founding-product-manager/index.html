<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company interview brief</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--ink:#1d1b18;--mute:#6f685d;--card:#fffdf8;--line:#e5dccb;--o:#ff7a3d;--g:#2fbf71;--b:#3d6bff;--y:#ffd23f;--p:#b980ff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "DM Sans",system-ui,sans-serif;padding:56px clamp(16px,5vw,80px) 80px;max-width:1440px;margin:0 auto}
h1,h2,.big{font-family:"Bricolage Grotesque",sans-serif}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:44px}
.top h1{font-size:clamp(40px,6vw,76px);font-weight:800;letter-spacing:-.03em;line-height:.95}
.top p{color:var(--mute)}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.nav a{padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--ink);color:var(--bg)}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:28px}
.t{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px;position:relative;min-width:0}
.t h2{font-size:13px;font-weight:700;font-family:"DM Sans";text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-bottom:22px;display:flex;align-items:center;gap:8px}
.t h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.big{font-size:38px;font-weight:800;line-height:1}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.fill{background:var(--c);border-color:transparent}
.mute{color:var(--mute)}
.empty{color:var(--mute);font-style:italic}
.est{font:700 9px "DM Sans";letter-spacing:.08em;background:#e8f0ff;color:#2a4fcf;border:1px solid #b9cbff;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
.map{display:flex;flex-direction:column;gap:16px;margin-top:24px}
.loc{display:flex;gap:10px;align-items:center}
.loc i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#0000000d;font-style:normal;flex:none}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.how div{background:#00000006;border-radius:18px;padding:20px}
.how b{display:block;margin:6px 0 4px}
.how em{font:800 22px "Bricolage Grotesque";font-style:normal;color:var(--o)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{padding:20px;border-radius:20px;background:#00000006}
.kpi small{display:block;color:var(--mute);font-size:12px;margin:4px 0}
.tl div{display:grid;grid-template-columns:86px 14px 1fr;gap:10px;align-items:start;padding-bottom:22px;position:relative}
.tl div i{width:14px;height:14px;border-radius:50%;background:var(--c,var(--b));margin-top:3px;position:relative;z-index:1}
.tl div:not(:last-child)::after{content:"";position:absolute;left:102px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl b{font-size:12px}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.prod{border-radius:20px;padding:24px;background:#00000005;border:2px solid transparent}
.prod.rel{border-color:var(--b);background:#3d6bff0d}
.prod h3{font-size:15px;display:flex;justify-content:space-between;gap:8px}
.prod ol{list-style:none;padding:0;margin:18px 0;counter-reset:s;display:grid;gap:9px}
.prod li{counter-increment:s;display:flex;gap:8px;font-size:12.5px}
.prod li::before{content:counter(s);width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:10px;display:grid;place-items:center;flex:none}
.pill{font-size:10px;font-weight:700;background:var(--b);color:#fff;padding:2px 7px;border-radius:99px;height:fit-content;white-space:nowrap}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:16px 0 12px}
.stack span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.ppl{display:grid;gap:20px;margin-top:28px}
.ppl.wide{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:0}
.pp{display:flex;gap:14px;align-items:flex-start}
.av{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--c)}
.pp p{font-size:12px;color:var(--mute)}
.pp a{margin-left:auto;font-weight:700;font-size:11px;color:#fff;background:#0a66c2;padding:3px 7px;border-radius:5px;text-decoration:none;flex:none}
.q{padding:20px 0;border-top:1px solid #00000022;display:grid;grid-template-columns:40px 1fr;gap:12px}
.q:first-of-type{border-top:0}
.q .big{font-size:26px}
.q p{font-weight:700;font-size:15px}
.q small{color:#1d1b18bb;display:block;margin-top:6px}
.ck{display:flex;gap:12px;padding:12px 0;cursor:pointer}
.ck input{accent-color:var(--g);width:17px;height:17px;flex:none;margin-top:2px}
.rv{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px dashed var(--line);font-size:13px}
.st{color:#e59a00}
.gauge{display:flex;align-items:baseline;gap:6px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.sc{background:#00000006;border-radius:18px;padding:16px}
.sc .big{font-size:32px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pc ul{list-style:none;padding:0;display:grid;gap:8px;margin-top:10px}
.pc li{padding:9px 12px;border-radius:12px;font-size:13px}
.pc .p li{background:#2fbf7114}.pc .c li{background:#ff7a3d14}
.chips{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:#2fbf7118;border-radius:10px;padding:6px 10px;font-size:12px}
.src{columns:3;column-gap:28px;font-size:13px}
.src a{display:block;color:var(--ink);padding:5px 0;break-inside:avoid}
@media(max-width:980px){body{padding:32px 16px 56px}.bento{gap:18px}.t{padding:22px}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.prods{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.scores,.pc{grid-template-columns:1fr}.src{columns:1}}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}.prods,.how{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div><p id="meta"></p><h1 id="name"></h1><p id="tag" style="font-size:17px;color:var(--ink);max-width:62ch;margin-top:6px"></p></div>
  <nav class="nav"><a href="#co">Company</a><a href="#pr">Products</a><a href="#te">Teams</a><a href="#iv">Questions</a><a href="#rv">Reviews</a><a href="#sr">Sources</a></nav>
</header>

<main class="bento">
  <section class="t c4 fill" style="--c:var(--y)" id="co"><h2>Where</h2><div class="big" id="hq"></div><div class="map" id="offices"></div></section>
  <section class="t c8"><h2><span class="dot" style="--c:var(--o)"></span>At a glance</h2><div class="kpis" id="kpis"></div></section>

  <section class="t c7"><h2><span class="dot" style="--c:var(--o)"></span>What they do → how they do it</h2><p style="font-size:18px;margin-bottom:22px" id="what"></p><div class="how" id="how"></div></section>
  <section class="t c5"><h2><span class="dot" style="--c:var(--b)"></span>Timeline · funding &amp; milestones</h2><div class="tl" id="tl"></div></section>

  <section class="t c12" id="pr"><h2><span class="dot" style="--c:var(--b)"></span>Products · how each one works</h2><div class="prods" id="prods"></div></section>

  <section class="t c12"><h2><span class="dot" style="--c:var(--y)"></span>Company leadership</h2><div class="ppl wide" id="cl"></div></section>
  <section class="t c6" id="te"><h2><span class="dot" style="--c:var(--p)"></span>Product team</h2><div id="pteam"></div></section>
  <section class="t c6"><h2><span class="dot" style="--c:var(--g)"></span>Tech team</h2><div id="tteam"></div></section>

  <section class="t c7 fill" style="--c:#c9f0d9" id="iv"><h2>Ask the interviewer</h2><div id="qs"></div></section>
  <section class="t c5"><h2><span class="dot" style="--c:var(--g)"></span>Role context</h2><div id="prep"></div></section>

  <section class="t c7" id="rv"><h2><span class="dot" style="--c:var(--p)"></span>What employees say</h2><div id="emp"></div></section>
  <section class="t c5"><h2><span class="dot" style="--c:var(--o)"></span>What customers say</h2><div id="cust"></div></section>

  <section class="t c12" id="sr"><h2><span class="dot" style="--c:var(--mute)"></span>Sources</h2><div class="src" id="src"></div></section>
</main>

const A=x=>Array.isArray(x)?x:[];
const none=t=>`<p class="empty">${h(t||'Not found in public sources.')}</p>`;
const E=f=>f&&f.est?'<span class="est" title="Estimate or sources disagree">EST.</span>':'';
const ini=n=>String(n||'?').split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
const st=n=>{const r=Math.max(0,Math.min(5,Math.round(n||0)));return `<span class="st">${'★'.repeat(r)}</span><span style="color:#ddd">${'★'.repeat(5-r)}</span>`};

document.title=`${D.company||'Company'} · interview brief`;
$('meta').textContent=[D.role,D.legalName,D.researched&&`researched ${D.researched}`].filter(Boolean).join(' · ');
$('name').textContent=D.company||'Company';
$('tag').textContent=D.tagline||'';
const hq=D.hq||{};
$('hq').innerHTML=`📍 ${h(hq.city||'—')}<div class="mute" style="font:500 13px 'DM Sans';margin-top:6px">${h(hq.region)}</div>`;
$('offices').innerHTML=A(D.offices).map(o=>`<div class="loc"><i>🏢</i><div><b>${h(o.city)}</b><div style="font-size:12px">${h(o.note)}</div></div></div>`).join('');

const F=D.facts||{};
const K=[['Strength · people','employees','👥'],['Type','type','🚀'],['Founded','founded','📅'],['In market','yearsInMarket','⏳'],['Funding','funding','💰'],['Rounds · last','rounds','#']];
$('kpis').innerHTML=K.map(([k,key,e])=>{const f=F[key]||{v:'—',note:'Not found'};const v=String(f.v??'—');
 return `<div class="kpi"><small>${e} ${h(k)}${E(f)}</small><div class="big" style="font-size:${v.length>8?20:28}px">${h(v)}</div><small>${h(f.note)}</small></div>`}).join('');

const kc={company:'var(--y)',people:'var(--p)',product:'var(--b)',money:'var(--o)'};
$('tl').innerHTML=A(D.timeline).map(t=>`<div style="--c:${kc[t.kind]||'var(--b)'}"><b>${h(t.date)}</b><i></i><span>${h(t.label)}</span></div>`).join('')||none();
$('what').textContent=D.what||'';
$('how').innerHTML=A(D.how).map((x,i)=>`<div><em>${i+1}</em><b>${h(x.k)}</b><span class="mute">${h(x.v)}</span></div>`).join('');

$('prods').innerHTML=A(D.products).map(p=>`<div class="prod ${p.relevant?'rel':''}"><h3><span>${h(p.icon||'◆')} ${h(p.name)}</span>${p.relevant?'<span class="pill">Likely your area</span>':''}</h3>
 <div class="mute">${h(p.short)}</div><ol>${A(p.steps).map(s=>`<li>${h(s)}</li>`).join('')}</ol><small class="mute">👤 ${h(p.users)}</small></div>`).join('')||none();

const person=(l,c)=>`<div class="pp"><div class="av" style="--c:${c}">${h(ini(l.name))}</div><div><b>${h(l.name)}</b> <span class="mute">· ${h(l.title)}</span><p>${h(l.bio)}</p></div>${l.linkedin?`<a href="${url(l.linkedin)}" target="_blank" rel="noopener" title="LinkedIn profile">in</a>`:''}</div>`;
$('cl').innerHTML=A(D.companyLeaders).map(l=>person(l,'#c99a00')).join('')||none();

const pal=['var(--o)','var(--b)','var(--g)','var(--p)','var(--y)'];
function team(T,el,c){T=T||{};const counts=A(T.counts),tot=counts.reduce((a,x)=>a+(+x.n||0),0);
 $(el).innerHTML=(tot?`<div class="gauge"><span class="big">${tot}</span><span class="mute">people found${E(T)}</span></div>
 <div class="stack">${counts.map((x,i)=>`<span style="width:${(+x.n||0)/tot*100}%;background:${pal[i%pal.length]}"></span>`).join('')}</div>
 <div class="legend">${counts.map((x,i)=>`<span><i style="background:${pal[i%pal.length]}"></i>${h(x.role)} <b>${h(x.n)}</b></span>`).join('')}</div>`:none('Team size not found.'))+
 `<p class="mute" style="font-size:13px;margin-top:14px">${h(T.note)}</p><div class="ppl">${A(T.leaders).map(l=>person(l,c)).join('')}</div>`;}
team(D.productTeam,'pteam','var(--p)');team(D.techTeam,'tteam','var(--g)');

$('qs').innerHTML=A(D.questions).map((q,i)=>`<div class="q"><span class="big">${i+1}</span><div><p>“${h(q.q)}”</p><small>${h(q.why)}</small></div></div>`).join('')||none();
$('prep').innerHTML=A(D.prep).map(p=>`<div class="ck"><span><b>${h(p.t)}</b> — <span class="mute">${h(p.d)}</span></span></div>`).join('')||none();

const R=D.employeeReviews||{};
$('emp').innerHTML=(R.headline?`<p style="margin:0 0 18px">${h(R.headline)}</p>`:'')+
 (A(R.scores).length?`<div class="scores">${A(R.scores).map(s=>`<div class="sc"><small class="mute">${h(s.where)}${E(s)}</small><div class="big">${s.score==null?'—':h(s.score)}</div>${s.score!=null?st(s.score):''}<div class="mute" style="font-size:12px">${h(s.count??0)} reviews${s.extra?' · '+h(s.extra):''}</div></div>`).join('')}</div>`:none('No employee ratings found.'))+
 (A(R.pros).length||A(R.cons).length?`<div class="pc"><div class="p"><b>👍 Pros</b><ul>${A(R.pros).map(x=>`<li>${h(x)}</li>`).join('')}</ul></div><div class="c"><b>⚠️ Cons</b><ul>${A(R.cons).map(x=>`<li>${h(x)}</li>`).join('')}</ul></div></div>`:'')+
 A(R.rows).map(r=>`<div class="rv" style="margin-top:14px"><span>${r.rating!=null?st(r.rating):''} <b>${h(r.role)}</b> · ${h(r.date)}</span><span>✅ ${h(r.pro)}<br>⚠️ ${h(r.con)}</span></div>`).join('');

$('cust').innerHTML=(A(D.customerReviews).map(r=>`<div class="rv"><span><b>${h(r.where)}</b><br><span class="mute">${h(r.text)}</span></span><span style="white-space:nowrap">${r.score!=null?`${st(r.score)} <b>${h(r.score)}</b>${E(r)}`:'<span class="mute">—</span>'}${r.count!=null?` <span class="mute">(${h(r.count)})</span>`:''}</span></div>`).join('')||none('No end-user reviews found.'))+
 (A(D.strengths).length?`<div class="chips">${A(D.strengths).map(s=>`<span>💪 ${h(s)}</span>`).join('')}</div>`:'')+
 (A(D.competitors).length?`<p class="mute" style="margin-top:14px;font-size:12px">Rivals: ${A(D.competitors).map(h).join(' · ')}</p>`:'');

$('src').innerHTML=A(D.sources).map(s=>`<a href="${url(s[1])}" target="_blank" rel="noopener">↗ ${h(s[0])}</a>`).join('')||none();
})();
</script>
</body>
</html>
